name: Experimental coordination repair installed consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-session-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime-cohort: [dev2, dev3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install existing pinned validation tooling
        run: |
          sha256sum --check requirements/ci-constraints.sha256
          sha256sum --check requirements/bench-constraints.sha256
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements/bench-constraints.txt
      - name: Require installed runtime and execute the new consumer
        run: python pheroos-bench/tools/verify_coordination_repair_install.py --runtime-cohort "${{ matrix.runtime-cohort }}" --bench-cohort dev4 --output "${RUNNER_TEMP}/coordination-repair-install.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: experimental-installed-session-consumer-${{ matrix.runtime-cohort }}
          path: ${{ runner.temp }}/coordination-repair-install.json
          if-no-files-found: error
