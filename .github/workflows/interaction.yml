name: Local inspection
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - name: Knowledge-base gate
        run: |
          # The gate's own tests live outside [tool.pytest.ini_options] testpaths, so they are
          # invoked explicitly; they are not interaction tests and must not inflate that count.
          python -m pytest -q tests/test_knowledge_base.py
          # Rule (a): the gate evaluates a clean archive of HEAD, never the working tree.
          python tools/check_knowledge_base.py
      - name: Installed CLI and local receipt replay
        working-directory: /tmp
        run: |
          pheroos-interaction inspect --config "$GITHUB_WORKSPACE/experiments/current/inspection-example/request.json" --source "$GITHUB_WORKSPACE/experiments/current/inspection-example/source" --output "$RUNNER_TEMP/inspection"
          pheroos-interaction inspect-replay --run "$RUNNER_TEMP/inspection"
      - name: Credential-free orchestration examples and offline replay
        working-directory: /tmp
        env:
          EXAMPLES: ${{ github.workspace }}/examples/orchestration
        run: |
          for name in workflow workflow-expected workflow-decomposition; do
            script="$EXAMPLES/script${name#workflow}.json"
            [ "$name" = workflow ] && script="$EXAMPLES/script.json"
            pheroos-interaction orchestrate --workflow "$EXAMPLES/$name.json" --script "$script" --output "$RUNNER_TEMP/$name"
            pheroos-interaction orchestrate-replay --run "$RUNNER_TEMP/$name"
          done
