name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  # ZIP timestamps cannot represent dates before 1980. Keep release builds
  # reproducible without relying on backend-specific timestamp clamping.
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        shard:
          - foundation
          - governance-1
          - governance-2
          - governance-3
          - governance-distributed-totality
          - governance-4
          - trace-1
          - trace-2
          - conformance-1
          - conformance-finality-reference
          - conformance-finality-independent
          - conformance-2
          - conformance-runtime
          - ecosystem
          - policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install provider-free core and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run one checked deterministic test shard
        run: python scripts/run_test_shard.py "${{ matrix.shard }}"

  lint-and-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install exact lint and type tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
      - name: Enforce full-repository Ruff lint
        run: python -m ruff check pheroos scripts tests
      - name: Enforce full-repository Ruff formatting
        run: python -m ruff format --check pheroos scripts tests
      - name: Type-check the complete package without cached results
        run: python -m mypy --no-incremental pheroos
      - name: Type-check release tooling without cached results
        run: >-
          python -m mypy --no-incremental scripts/release_candidate.py
          scripts/generate_release_sbom.py
          scripts/check_distribution_reproducibility.py
          scripts/check_ci_supply_chain.py
          scripts/check_repository_policy.py
      - name: Strictly type-check the Stable candidate owner closure
        run: python scripts/check_stable_typing.py --check

  schema-version-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check schema, report, and static contract drift
        run: >-
          python -m pytest -q tests/cli/test_schema_export.py
          tests/governance/test_schema_static_contracts.py
          tests/trace/test_static_contracts.py
          tests/conformance/test_report_v2.py
      - name: Check generated TCK and ABI artifacts
        run: |
          python scripts/generate_schema_artifacts.py --check
          python scripts/generate_commit_tck.py --check
          python scripts/generate_public_api_inventory.py --check
          python scripts/generate_governance_public_api.py --check
          python scripts/check_legacy_authority_inventory.py --check
          git diff --check

  public-abi-shape-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify public shape, lifecycle, aliases, and ownership
        run: >-
          python -m pytest -q tests/test_public_api_inventory.py
          tests/test_public_api_contract.py
          tests/conformance/test_public_abi_boundary.py
          tests/conformance/test_public_api_lifecycle.py

  manifest-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Reject malformed, duplicate, non-finite, and unknown-version input
        run: >-
          python -m pytest -q tests/protocol/test_manifest_validation.py
          tests/conformance/test_protocol_version_fail_closed.py

  tck-v1-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run frozen 38-case legacy TCK and adversarial mutations
        run: |
          python -m pytest -q tests/conformance/test_commit_tck.py
          python -m pheroos.cli.main tck run --version v1

  tck-v2-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run declarative v2 reference and manifest-derived proof
        run: |
          python -m pheroos.cli.main tck run --version v2
          python -m pytest -q tests/conformance/test_commit_tck_v2.py -k "schemas_are_public or declarative_golden or manifest_sensitive or manifest_threshold or manifest_assurance or attention_changes or scalar_leaf"

  tck-v2-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run independent JSONL spec model from an external cwd
        run: |
          python -m pheroos.cli.main tck run --version v2 --adapter "python -I -m pheroos.conformance.commit_tck_v2_spec_adapter"
          python -m pytest -q tests/conformance/test_commit_tck_v2.py -k "independent_spec_model or real_jsonl_handshake or no_governance"

  external-adapter-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Prove malicious and stateful adapters fail closed
        run: >-
          python -m pytest -q tests/conformance/test_commit_tck_v2.py
          -k "hard_coded or expected_echo or malformed_out_of_order or state_leakage or versions_are_distinct or incompatible_handshake"

  consumer-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify consumers, lazy facade, identities, and provider-free examples
        run: >-
          python -m pytest -q tests/e2e tests/test_public_api_contract.py
          tests/governance/test_lazy_facade.py
          tests/governance/test_static_engine_compatibility.py
          tests/governance/test_lifecycle_module_decomposition.py
          tests/examples/test_hybrid_replay_protocol.py
      - name: Run maintained protocol examples
        run: |
          pheroos validate examples/toy-protocol/capability.json
          pheroos conformance examples/toy-protocol
          pheroos conformance examples/e2e-protocol
          pheroos conformance examples/swarm-protocol
          pheroos conformance examples/hybrid-pheromone-protocol
          pheroos conformance examples/hybrid-commit-protocol
          pheroos conformance examples/distributed-commit-protocol

  scope-concurrency-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify opaque scope, cross-scope denial, and concurrent idempotency
        run: >-
          python -m pytest -q tests/kernel/test_runtime_scope.py
          tests/kernel/test_driver_syscalls.py
          tests/drivers/test_driver_invocation.py
          tests/conformance/test_runtime_scope_contract.py

  authority-restart-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify restart, CAS, atomic state-plus-trace, and 32-worker races
        run: >-
          python -m pytest -q tests/governance/test_authority_ledger.py
          tests/governance/test_atomic_hybrid_commit.py
          tests/conformance/test_authority_ledger_contract.py
      - name: Verify durable Hybrid Replay v2 Governance, Conformance, and Trace
        run: >-
          python -m pytest -q tests/governance/test_hybrid_replay_v2_*.py
          tests/conformance/test_hybrid_replay_v2_contract.py
          tests/trace/test_hybrid_replay_v2_trace_contract.py
      - name: Verify Hybrid Replay v2 public-proxy and resource boundaries
        run: >-
          python -m pytest -q
          tests/conformance/test_hybrid_replay_v2_contract.py::test_hybrid_replay_v2_adversarial_support_uses_only_public_abi_proxies
          tests/conformance/test_hybrid_replay_v2_contract.py::test_hybrid_replay_v2_resource_support_uses_only_public_constructors

  wheel-sdist-external-cwd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install exact build backend
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
      - name: Build reproducible wheel and sdist without an unpinned resolver
        run: |
          python -m build --no-isolation
          python scripts/normalize_sdist.py dist/*.tar.gz --source-date-epoch "$SOURCE_DATE_EPOCH"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/pheroos-repro"
          python scripts/normalize_sdist.py "$RUNNER_TEMP"/pheroos-repro/*.tar.gz --source-date-epoch "$SOURCE_DATE_EPOCH"
          python scripts/check_distribution_reproducibility.py dist "$RUNNER_TEMP/pheroos-repro"
      - name: Install both distributions into isolated environments
        run: |
          python -m venv "$RUNNER_TEMP/pheroos-wheel"
          "$RUNNER_TEMP/pheroos-wheel/bin/python" -m pip install --no-deps dist/*.whl
          python -m venv "$RUNNER_TEMP/pheroos-sdist"
          "$RUNNER_TEMP/pheroos-sdist/bin/python" -m pip install --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/requirements/ci-constraints.txt"
          "$RUNNER_TEMP/pheroos-sdist/bin/python" -m pip install --no-build-isolation --no-deps dist/*.tar.gz
      - name: Verify installed artifacts outside the source working directory
        run: |
          cd "$RUNNER_TEMP"
          PYTHON="$RUNNER_TEMP/pheroos-wheel/bin/python"
          PHEROOS="$RUNNER_TEMP/pheroos-wheel/bin/pheroos"
          "$PYTHON" -m pip check
          "$PHEROOS" version
          "$PHEROOS" validate "$GITHUB_WORKSPACE/examples/toy-protocol/capability.json"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/toy-protocol"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/swarm-protocol"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/hybrid-pheromone-protocol"
          "$PHEROOS" wire validate capability-v3 "$GITHUB_WORKSPACE/examples/hybrid-replay-protocol/capability.json"
          "$PYTHON" "$GITHUB_WORKSPACE/examples/hybrid-replay-protocol/run.py"
          "$PHEROOS" source-conformance
          "$PHEROOS" schema list
          "$PHEROOS" tck run --version v1
          "$PHEROOS" tck run --version v2
          PYTHON="$RUNNER_TEMP/pheroos-sdist/bin/python"
          PHEROOS="$RUNNER_TEMP/pheroos-sdist/bin/pheroos"
          "$PYTHON" -m pip check
          "$PHEROOS" version
          "$PHEROOS" validate "$GITHUB_WORKSPACE/examples/toy-protocol/capability.json"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/toy-protocol"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/swarm-protocol"
          "$PHEROOS" conformance "$GITHUB_WORKSPACE/examples/hybrid-pheromone-protocol"
          "$PHEROOS" wire validate capability-v3 "$GITHUB_WORKSPACE/examples/hybrid-replay-protocol/capability.json"
          "$PYTHON" "$GITHUB_WORKSPACE/examples/hybrid-replay-protocol/run.py"
          "$PHEROOS" source-conformance
          "$PHEROOS" schema list
          "$PHEROOS" tck run --version v1
          "$PHEROOS" tck run --version v2
      - name: Preserve the exact distributions that passed external validation
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pheroos-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  import-dag-and-cold-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify static DAG, unique owners, and absence of hidden registries
        run: >-
          python -m pytest -q tests/kernel/test_kernel_import_boundary.py
          tests/conformance/test_package_import_graph.py
          tests/governance/test_private_import_graph.py
          tests/governance/test_swarm_domain_structure.py
          tests/governance/test_lazy_facade.py
          tests/conformance/test_lazy_facade.py
          tests/trace/test_static_contracts.py
      - name: Enforce governance cold-import budget
        run: python scripts/benchmark_governance_import.py --samples 5 --check

  reference-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify immutable reference budgets
        run: |
          python -m pytest -q tests/performance/test_reference_performance_contract.py
          python scripts/check_reference_performance.py --check --quick

  engineering-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install provider-free core and exact baseline tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Enforce the checked engineering baseline
        run: python scripts/check_engineering_baseline.py --check
      - name: Run WP-00 policy and baseline tests
        run: >-
          python -m pytest -q tests/ci/test_engineering_baseline.py
          tests/ci/test_quality_gate.py
          tests/ci/test_repository_policy.py
          tests/governance/test_wp00_legacy_characterization.py

  coverage-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - foundation
          - governance-1
          - governance-2
          - governance-3
          - governance-distributed-totality
          - governance-4
          - trace-1
          - trace-2
          - conformance-1
          - conformance-finality-reference
          - conformance-finality-independent
          - conformance-2
          - conformance-runtime
          - ecosystem
          - policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install exact CI-only coverage tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Measure one immutable branch-coverage shard
        run: >-
          python scripts/check_coverage_gate.py
          --measure-shard "${{ matrix.shard }}"
          --measure-only
          --data-file ".coverage.${{ matrix.shard }}"
      - name: Upload exact shard data for offline combination
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pheroos-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage-gate:
    needs: [coverage-measure]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history for changed-source coverage
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install exact CI-only coverage tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download all immutable branch-coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pheroos-coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Resolve exact changed-source base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/check_coverage_gate.py --emit-ci-base >> "$GITHUB_ENV"
      - name: Enforce combined branch coverage and local ratchets
        run: >-
          python scripts/check_coverage_gate.py
          --combine-shards-dir coverage-data --data-file .coverage
          --base-ref "$COVERAGE_BASE_REF"
      - name: Test coverage gate fail-closed semantics
        run: python -m pytest -q tests/ci/test_coverage_gate.py

  authority-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Verify reproducible toolchain constraints
        run: sha256sum --check requirements/ci-constraints.sha256
      - name: Install provider-free core and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-constraints.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Kill every checked-in P0 authority mutant
        run: python scripts/check_authority_mutation.py --profile pr
      - name: Test four-state mutation scoring and fail-closed policy
        run: >-
          python -m pytest -q tests/ci/test_authority_mutation_gate.py
          tests/ci/test_authority_mutation_probes.py

  supply-chain:
    needs: [wheel-sdist-external-cwd]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify action, permission, constraint, and provenance policy
        run: |
          sha256sum --check requirements/ci-constraints.sha256
          python scripts/check_ci_supply_chain.py --check
          python scripts/check_repository_policy.py --check
      - name: Download the exact externally validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pheroos-distributions
          path: dist
      - name: Generate deterministic CycloneDX and SPDX SBOMs
        run: >-
          python scripts/generate_release_sbom.py dist
          --cyclonedx sbom/pheroos.cdx.json --spdx sbom/pheroos.spdx.json
          --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Validate release metadata and SBOM content
        run: python -m unittest -q tests.ci.test_supply_chain
      - name: Upload distributions and SBOMs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pheroos-release-artifacts
          path: |
            dist/*
            sbom/*.json
          if-no-files-found: error
          retention-days: 14

  provenance:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Ju1se/PheroOS'
    needs:
      - python-tests
      - lint-and-typing
      - schema-version-drift
      - public-abi-shape-drift
      - manifest-negative
      - tck-v1-legacy
      - tck-v2-reference
      - tck-v2-independent
      - external-adapter-adversarial
      - consumer-compat
      - scope-concurrency-lifecycle
      - authority-restart-atomicity
      - wheel-sdist-external-cwd
      - import-dag-and-cold-import
      - reference-performance
      - supply-chain
      - engineering-baseline
      - coverage-measure
      - coverage-gate
      - authority-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Download the exact release subjects produced by supply-chain
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pheroos-release-artifacts
          path: .
      - name: Verify downloaded distribution hashes and SBOM content
        run: |
          sha256sum --check requirements/ci-constraints.sha256
          python scripts/check_ci_supply_chain.py --check
          python -m unittest -q tests.ci.test_supply_chain
      - name: Attest release build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Attest CycloneDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: sbom/pheroos.cdx.json
      - name: Attest SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: sbom/pheroos.spdx.json

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - python-tests
      - lint-and-typing
      - schema-version-drift
      - public-abi-shape-drift
      - manifest-negative
      - tck-v1-legacy
      - tck-v2-reference
      - tck-v2-independent
      - external-adapter-adversarial
      - consumer-compat
      - scope-concurrency-lifecycle
      - authority-restart-atomicity
      - wheel-sdist-external-cwd
      - import-dag-and-cold-import
      - reference-performance
      - supply-chain
      - engineering-baseline
      - coverage-measure
      - coverage-gate
      - authority-mutation
      - provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the policy evaluator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Require every validation result and event-correct provenance
        env:
          QUALITY_GATE_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/check_quality_gate.py
