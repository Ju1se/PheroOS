[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pheroos"
version = "0.1.0"
description = "Protocol-governed AI-as-OS kernel and reference multi-agent runtime."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
keywords = [
  "ai-os",
  "multi-agent",
  "agent-protocol",
  "governance",
  "capability-runtime",
  "agent-kernel",
  "pheroos",
]
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "langgraph>=0.2.0",
  "psycopg2-binary>=2.9.9",
  "pypdf>=5.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/Ju1se/PheroOS"
Documentation = "https://github.com/Ju1se/PheroOS/tree/main/docs"
Issues = "https://github.com/Ju1se/PheroOS/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
proxy = [
  "litellm>=1.70.0",
]

[project.scripts]
pheroos = "pheroos.cli:main"
pheroos-conformance = "pheroos.cli:conformance_main"

[tool.setuptools.packages.find]
include = ["app*", "runtime*", "tools*", "pheroos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
