[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pheroos"
version = "0.1.0"
description = "Open swarm-native multi-agent operating protocol core for governed agent runtimes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["multi-agent-os", "operating-protocol", "protocol-core", "kernel", "governance", "drivers", "conformance"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ju1se/PheroOS"
Documentation = "https://github.com/Ju1se/PheroOS/tree/main/docs"
Issues = "https://github.com/Ju1se/PheroOS/issues"
Changelog = "https://github.com/Ju1se/PheroOS/blob/main/CHANGELOG.md"
Specification = "https://github.com/Ju1se/PheroOS/blob/main/SPEC.md"
Security = "https://github.com/Ju1se/PheroOS/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22,<5",
  "pytest>=8.0.0",
]

[project.scripts]
pheroos = "pheroos.cli.main:main"

[tool.setuptools.packages.find]
include = ["pheroos*"]

[tool.setuptools.package-data]
"pheroos.conformance" = ["tck/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
