[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "pheroos-interaction"
version = "0.1.0.dev1"
description = "Small trusted-host multi-agent interaction research and exact-input replay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pheroos-interaction = "pheroos_interaction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/interaction"]
pythonpath = ["src"]
